<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NimbusOS noVNC</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #15181d; color: #eef1f5; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: 36px minmax(0, 1fr); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #20252c; border-bottom: 1px solid #343b45; }
    #status { color: #bdc6d1; }
    #screen { min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
    #screen canvas { display: block; }
    #release { border: 1px solid #505a67; border-radius: 4px; background: #2b323b; color: inherit; padding: 4px 9px; cursor: pointer; }
    #release:hover { background: #39434f; }
  </style>
</head>
<body>
  <header>
    <span id="status">Connecting to NimbusOS...</span>
    <button id="release" type="button" title="Release mouse capture">Release mouse</button>
  </header>
  <main id="screen" aria-label="NimbusOS display"></main>
  <script type="module" src="/pointer-lock.js"></script>
</body>
</html>
